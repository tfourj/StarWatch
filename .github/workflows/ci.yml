name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run build:demo

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Builds of the same commit (a push to main and its release tag) run one after the other, so the later
    # one sees the tag and :main ends up with the release image.
    concurrency:
      group: image-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    env:
      # Pull requests from forks get a read-only token, so they only build the image.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags and history to count commits since the newest release.
          fetch-depth: 0

      # Any build of a commit that carries the stable tag for package.json's version is a release build. A release
      # tag pushed while its commit is still the head of main also publishes :main.
      - name: Check for a release tag
        id: release
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(jq -r .version package.json)"
          release=false
          main=false
          if [[ "$version" != *-* ]]; then
            # Annotated tags list the tag object first and the commit it points at as ^{} after it.
            tag="refs/tags/v$version"
            tag_sha="$(git ls-remote --tags origin | awk -v t="$tag" '$2 == t || $2 == t"^{}" { s = $1 } END { print s }')"
            if [ "$tag_sha" = "$SHA" ]; then release=true; fi
          fi
          main_sha="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$release" = true ] && [ "$main_sha" = "$SHA" ]; then main=true; fi
          describe="$(git describe --tags --long --match 'v[0-9]*' --exclude '*-*' "$SHA" 2>/dev/null || true)"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "describe=$describe" >> "$GITHUB_OUTPUT"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "v$version release build: $release, head of $DEFAULT_BRANCH: $main, describe: ${describe:-none}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Releases (tags like v1.2.3): v1.2.3, v1.2, v1 and latest. Pre-releases (v1.2.3-rc.1) only get their
          # exact tag. Pushes to main get :main, so :latest always means the newest release. A release tag on the
          # head of main also gets :main. Pull requests get :pr-<number> and :preview, which always points at the
          # most recent pull request build.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=main,enable=${{ steps.release.outputs.main == 'true' }}
            type=ref,event=pr
            type=raw,value=preview,enable=${{ github.event_name == 'pull_request' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests use the head commit, not the merge commit GitHub builds.
          build-args: |
            STARWATCH_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            STARWATCH_RELEASE=${{ steps.release.outputs.release }}
            STARWATCH_DESCRIBE=${{ steps.release.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
